name: Reconnaissance Flow

on:
  #schedule:
    #- cron: '0 * * * *' 
  workflow_dispatch:        # Ejecución manual (opcional)
    inputs:
      domain:
        description: 'Dominio a escanear'
        required: true
        type: string

env:
  DOMAIN: ${{ github.event.inputs.domain }}

defaults:
  run:
    shell: bash --noprofile --norc {0}

jobs:
    Subfinder:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Download subfinder
              run: |
                wget -O /tmp/subfinder_2.8.0_linux_amd64.zip https://github.com/projectdiscovery/subfinder/releases/download/v2.14.0/subfinder_2.14.0_linux_amd64.zip
                unzip /tmp/subfinder_2.8.0_linux_amd64.zip -d /tmp

            - name: Run subfinder
              run: |
                /tmp/subfinder -silent -d ${{ env.DOMAIN }} -all -recursive -o /tmp/subfinder.txt
                cat /tmp/subfinder.txt
            
            - name: Upload results
              uses: actions/upload-artifact@v4
              with:
                name: subfinder-results
                path:   
                  /tmp/subfinder.txt      
    Findomain:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Download findomain
              run: |
                wget -O /tmp/findomain.zip https://github.com/Findomain/Findomain/releases/download/10.0.1/findomain-linux.zip
                unzip /tmp/findomain.zip -d /tmp
            - name: Run findomain
              run: |
                    /tmp/findomain -q -t ${{ env.DOMAIN }} > /tmp/findomain.txt
                    cat /tmp/findomain.txt

            - name: Upload results
              uses: actions/upload-artifact@v4
              with:
                name: findomain-results
                path:   
                  /tmp/findomain.txt          
    Assetfinder:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - name: Download assetfinder
              run: |
                wget -O /tmp/assetfinder.tgz https://github.com/tomnomnom/assetfinder/releases/download/v0.1.1/assetfinder-linux-amd64-0.1.1.tgz
                tar -xzf /tmp/assetfinder.tgz -C /tmp
            - name: Run assetfinder
              run: |
                /tmp/assetfinder --subs-only ${{ env.DOMAIN }} > /tmp/assetfinder.txt
                cat /tmp/assetfinder.txt

            - name: Upload results
              uses: actions/upload-artifact@v4
              with:
                name: assetfinder-results
                path:   
                  /tmp/assetfinder.txt          
    FilterSubdomains:
        runs-on: ubuntu-latest
        needs: [Subfinder, Findomain, Assetfinder]
        steps:
            - name: Download artifacts
              uses: actions/download-artifact@v4
              with:
                path: ./results

            - name: List downloaded files
              run: |
                echo "📂 Archivos descargados:"
                ls -la ./results/
                echo ""
                echo "📁 Estructura:"
                find ./results -type f

            - name: Combine all results
              run: |
                # Crear carpeta para resultados combinados
                mkdir -p ./combined
                
                # Subfinder
                if [ -f ./results/subfinder-results/subfinder.txt ]; then
                  cat ./results/subfinder-results/subfinder.txt >> ./combined/all_results.txt
                  echo "" >> ./combined/all_results.txt
                else
                  echo "⚠️ Subfinder: No se encontraron resultados" >> ./combined/all_results.txt
                fi
                
                # Findomain
                if [ -f ./results/findomain-results/findomain.txt ]; then
                  cat ./results/findomain-results/findomain.txt >> ./combined/all_results.txt
                  echo "" >> ./combined/all_results.txt
                else
                  echo "⚠️ Findomain: No se encontraron resultados" >> ./combined/all_results.txt
                fi
                
                # Assetfinder
                if [ -f ./results/assetfinder-results/assetfinder.txt ]; then
                  cat ./results/assetfinder-results/assetfinder.txt >> ./combined/all_results.txt
                  echo "" >> ./combined/all_results.txt
                else
                  echo "⚠️ Assetfinder: No se encontraron resultados" >> ./combined/all_results.txt
                fi
                
                cat ./combined/all_results.txt  | sort -u > ./combined/all_results_sorted0.txt
                wget -O /tmp/dnsx.zip https://github.com/projectdiscovery/dnsx/releases/download/v1.2.3/dnsx_1.2.3_linux_amd64.zip
                unzip /tmp/dnsx.zip -d /tmp
                cat ./combined/all_results_sorted0.txt | /tmp/dnsx -silent  > ./combined/all_results_sorted.txt
                echo "✅ Resultados combinados guardados en ./combined/all_results_sorted.txt"
                
            #- name: Generate summary report
            #  run: |
            #    # Crear resumen para GitHub Step Summary
            #    echo "# 📊 Reporte de subdominios - ${{ env.DOMAIN }}" >> $GITHUB_STEP_SUMMARY
            #    echo "" >> $GITHUB_STEP_SUMMARY
            #    echo "📅 **Fecha:** $(date '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_STEP_SUMMARY
            #    echo "" >> $GITHUB_STEP_SUMMARY
            #    
            #    echo "## 📈 Cantidad : $(wc -l < ./combined/all_results_sorted.txt)" >> $GITHUB_STEP_SUMMARY
            #    cat ./combined/all_results_sorted.txt >> $GITHUB_STEP_SUMMARY
            #    echo "" >> $GITHUB_STEP_SUMMARY
            #    echo "📁 **Resultados completos:**" >> $GITHUB_STEP_SUMMARY
            #    echo "Descarga los artefactos desde este workflow." >> $GITHUB_STEP_SUMMARY

            - name: Upload combined results
              uses: actions/upload-artifact@v4
              with:
                name: subdomains_alive
                path: ./combined/all_results_sorted.txt

            #- name: Send Telegram Notification
            #  run: |
            #    name="report-${{ env.DOMAIN }}-$(date '+%Y-%m-%d_%H-%M-%S').txt"
            #    echo "Total de subdominios: $(cat ./combined/all_results_sorted.txt | wc -l)" > ./combined/$name
            #    echo >> ./combined/$name
            #    cat ./combined/all_results_sorted.txt  >> ./combined/$name
            #    curl -s -X POST "https://api.telegram.org/bot${{ secrets.TOKENTELEGRAM }}/sendDocument" \
            #         -F chat_id="${{ secrets.CHATIDTELEGRAM }}" \
            #         -F document="@./combined/$name"
    WebArchive:
        runs-on: ubuntu-latest
        needs: FilterSubdomains
        steps:
            - name: Execute curl to WebArchive
              run: |
                curl -s -k "http://web.archive.org/cdx/search/cdx?url=$TARGET/*&output=text&fl=original&collapse=urlkey" | sort -u > /tmp/results_wayback.txt
            
            - name: Upload results
              uses: actions/upload-artifact@v4
              with:
                name: wayback-results
                path:
                  /tmp/results_wayback.txt 
    Katana:
        runs-on: ubuntu-latest
        needs: FilterSubdomains
        steps:
            - name: Download artifacts
              uses: actions/download-artifact@v4
              with:
                path: ./results
        
            - name: Download katana
              run: |
                wget -O /tmp/katana.zip https://github.com/projectdiscovery/katana/releases/download/v1.2.2/katana_1.2.2_linux_amd64.zip
                unzip /tmp/katana.zip -d /tmp
              
            - name: Run katana
              run: |
                /tmp/katana -silent -u ./results/subdomains_alive/all_results_sorted.txt -d 5 -fx -ef woff,css,png,svg,jpg,woff2,jpeg,gif,svg -o /tmp/results_katana.txt
                cat /tmp/results_katana.txt
            
            - name: Upload results
              uses: actions/upload-artifact@v4
              with:
                name: katana-results
                path:   
                  /tmp/results_katana.txt
    URLFinder:
        runs-on: ubuntu-latest
        needs: FilterSubdomains
        steps:
            - name: Download artifacts
              uses: actions/download-artifact@v4
              with:
                path: ./results
              
            - name: Download urlfinder
              run: |
                wget -O /tmp/urlfinder.zip https://github.com/projectdiscovery/urlfinder/releases/download/v0.0.3/urlfinder_0.0.3_linux_amd64.zip
                unzip /tmp/urlfinder.zip -d /tmp
             
            - name: Run urlfinder
              run: |
                cat ./results/subdomains_alive/all_results_sorted.txt | /tmp/urlfinder -rl 20 -timeout 5 -silent -o /tmp/results_urlfinder.txt
                cat /tmp/results_urlfinder.txt
            
            - name: Upload results
              uses: actions/upload-artifact@v4
              with:
                name: urlfinder-results
                path:   
                  /tmp/results_urlfinder.txt
    Hakrawler:
        runs-on: ubuntu-latest
        needs: FilterSubdomains
        steps:
            - name: Download artifacts
              uses: actions/download-artifact@v4
              with:
                path: ./results

            - name: Download hakrawler
              run: |
                wget -O /tmp/hakrawler.zip https://github.com/hakluke/hakrawler/archive/refs/tags/2.1.zip
                unzip /tmp/hakrawler.zip -d /tmp
        
            - name: Run hakrawler
              run: |
                cd /tmp/hakrawler-2.1 && go build
                cat ./results/subdomains_alive/all_results_sorted.txt | /tmp/hakrawler-2.1/hakrawler -u  > /tmp/results_hakrawler
                cat /tmp/results_hakrawler
            
            - name: Upload results
              uses: actions/upload-artifact@v4
              with:
                name: hakrawler-results
                path:   
                  /tmp/results_hakrawler
    Gau:
        runs-on: ubuntu-latest
        needs: FilterSubdomains
        steps:
            - name: Download artifacts
              uses: actions/download-artifact@v4
              with:
                path: ./results
            
            - name: Download gau
              run: |
                wget -O /tmp/gau.tar.gz https://github.com/lc/gau/releases/download/v2.2.4/gau_2.2.4_linux_amd64.tar.gz
                tar -xzf /tmp/gau.tar.gz -C /tmp
            
            - name: Run gau
              run: |
                cat ./results/subdomains_alive/all_results_sorted.txt | /tmp/gau --threads 5 > /tmp/results_gau.txt
                cat /tmp/results_gau.txt
            
            - name: Upload results
              uses: actions/upload-artifact@v4
              with:
                name: gau-results
                path:   
                  /tmp/results_gau.txt
    FilterResultsURLs:
        runs-on: ubuntu-latest
        needs: [WebArchive, Katana, URLFinder, Hakrawler, Gau]
        steps:
            - name: Download artifacts
              uses: actions/download-artifact@v4
              with:
                path: ./results
                
            - name: Combine all results
              run: |
                # Crear carpeta para resultados combinados
                mkdir -p ./combined
                cat ./results/katana-results/results_katana.txt ./results/urlfinder-results/results_urlfinder.txt ./results/hakrawler-results/results_hakrawler ./results/gau-results/results_gau.txt | sort -u > ./combined/all_results_combined.txt
                cat ./combined/all_results_combined.txt
            
            - name: Upload combined results
              uses: actions/upload-artifact@v4
              with:
                name: all-results-combined
                path: ./combined/all_results_combined.txt

    GetJsFiles:
      runs-on: ubuntu-latest
      needs: FilterResultsURLs
      steps:
            - name: Download artifacts
              uses: actions/download-artifact@v4
              with:
                path: ./results

            - name: First Filter JS files
              run: |
                mkdir -p ./combined
                grep -iE "\.js([?#].*)?$" ./results/all-results-combined/all_results_combined.txt >> ./combined/js_files.txt
                cat ./combined/js_files.txt
              
            - name: Second Filter JS files
              run: |
                INPUT_FILE="./results/subdomains_alive/all_results_sorted.txt"
                OUTPUT_FILE="./js_hosts_v1"
                OUTPUT_FILE2="./js_hosts_v2"
                USER_AGENT="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
                
                cat "$INPUT_FILE"
                touch "$OUTPUT_FILE" "$OUTPUT_FILE2"

                while read -r host; do
                    if [[ ! "$host" =~ ^https?:// ]]; then
                        host="https://$host"
                    fi
                    curl -sk "$host" --max-time 6 -A "$USER_AGENT" 2>/dev/null \
                        | grep -oE '/_next/static/chunks/[^"]+\.js' \
                        | while read -r js; do
                            full_url="$host$js"
                            echo "$full_url"
                            echo "$full_url" >> "$OUTPUT_FILE"
                          done
                    sleep $((RANDOM % 3))
                    curl -sk "$host" --max-time 6 -A "$USER_AGENT" 2>/dev/null \
                        | grep -oE 'src="[^"]+\.js"' \
                        | sed 's/src="//;s/"$//' \
                        | while read -r js; do
                            #1 Si comienza con ./ → QUITAR el punto
                            if [[ "$js" == ./*  ]]; then
                                js=$(echo "$js" | sed 's|^\./|/|') # Remove leading "./"
                                full_url="$host$js"
                                echo "$full_url"
                            #2 Si comienza con / → NO agregar / (concatenar directo)
                            elif [[ "$js" == /* ]]; then
                                full_url="$host$js"
                                echo "$full_url"

                            #3 Si comienza con letra → AGREGAR /
                            elif [[ "$js" =~ ^[a-zA-Z0-9] ]]; then
                                full_url="$host/$js"
                                echo "$full_url"
                            fi
                            echo "$full_url" >> "$OUTPUT_FILE2"
                          done
                done < "$INPUT_FILE"
                cat "$OUTPUT_FILE" "$OUTPUT_FILE2" | sort -u >> ./combined/js_files.txt
                cat ./combined/js_files.txt
            
            - name: Upload JS files
              uses: actions/upload-artifact@v4
              with:
                name: js-files
                path: ./combined/js_files.txt

            #- name: Send Telegram Notification
            #  run: |
            #    name="report-${{ env.DOMAIN }}-$(date '+%Y-%m-%d_%H-%M-%S')-jsfiles.txt"
            #    cp ./combined/js_files.txt ./$name
            #    curl -s -X POST "https://api.telegram.org/bot${{ secrets.TOKENTELEGRAM }}/sendDocument" \
            #         -F chat_id="${{ secrets.CHATIDTELEGRAM }}" \
            #         -F document="@./$name"
    
    SendAllSecrets:
        runs-on: ubuntu-latest
        needs: GetJsFiles
        env:
          OUTPUT_FILE: ./secrets.txt
        steps:
            - name: Download artifacts
              uses: actions/download-artifact@v4
              with:
                path: ./results
            
            - name: Identify potential secrets in JS files
              run: |
                INPUT_FILE="./results/js-files/js_files.txt"
                OUTPUT_FILE="./secrets.txt"
                USER_AGENT="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
                
                > "$OUTPUT_FILE" #Make file empty before starting
                cat "$INPUT_FILE"
                while read -r urls_js; do
                    [[ -z "$urls_js" ]] && continue  # Skip empty lines
                    echo -e "\nProcessing: $urls_js" >> "$OUTPUT_FILE"
                    curl -sLk "$urls_js" --max-time 6 -A "$USER_AGENT" 2>/dev/null -o ./main.js                    
                    echo -e "Extracting urls:" >> "$OUTPUT_FILE"
                    cat ./main.js | grep -oE '"?((http(s?)|ftp):(//|/))[a-zA-Z0-9._\/=&:-]+(\.[a-zA-Z0-9._\/?-]+=&:)?"?' >> "$OUTPUT_FILE" # Extract URLs
                    echo -e "\nSecrets: \n" >> "$OUTPUT_FILE"
                    cat ./main.js | grep -oiE '(api[_-]?key|secret|token|auth|password|bearer)["\047]?\s*[:=]\s*["\047][A-Za-z0-9_\-\.]{8,}["\047]' >> "$OUTPUT_FILE" # Posibles secretos genéricos
                    echo -e "\nGoogle API key: \n" >> "$OUTPUT_FILE"
                    cat ./main.js | grep -oE 'AIza[0-9A-Za-z_\-]{35}' >> "$OUTPUT_FILE"           # Google API key
                    echo -e "\nAWS Access Key ID: \n" >> "$OUTPUT_FILE"
                    cat ./main.js | grep -oE 'AKIA[0-9A-Z]{16}' >> "$OUTPUT_FILE"                 # AWS Access Key ID
                    echo -e "\nAWS Secret Access Key: \n " >> "$OUTPUT_FILE"
                    cat ./main.js | grep -oE 'sk_live_[0-9a-zA-Z]{24,}' >> "$OUTPUT_FILE"         # Stripe
                    echo -e "\nGitHub Token: \n" >> "$OUTPUT_FILE"
                    cat ./main.js | grep -oE 'ghp_[0-9a-zA-Z]{36}' >> "$OUTPUT_FILE"              # GitHub token
                    echo -e "\nJWT: \n" >> "$OUTPUT_FILE"
                    cat ./main.js | grep -oE 'eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]*' >> "$OUTPUT_FILE"  # JWT
                    echo -e "\n" >> "$OUTPUT_FILE"
                    rm -rf ./main.js
                    sleep $((RANDOM % 3))
                done < "$INPUT_FILE"
            
            - name: Send Telegram Notification
              run: |
                name="report-${{ env.DOMAIN }}-$(date '+%Y-%m-%d_%H-%M-%S')-secrets.txt"
                cp ./secrets.txt ./$name
                curl -s -X POST "https://api.telegram.org/bot${{ secrets.TOKENTELEGRAM }}/sendDocument" \
                     -F chat_id="${{ secrets.CHATIDTELEGRAM }}" \
                     -F document="@./$name"
    SendAllURLs:
        runs-on: ubuntu-latest
        needs: FilterResultsURLs
        steps:
            - name: Download artifacts
              uses: actions/download-artifact@v4
              with:
                path: ./urls

            - name: Send Telegram Notification
              run: |
                name="report-${{ env.DOMAIN }}-$(date '+%Y-%m-%d_%H-%M-%S').txt"
                cp ./urls/all-results-combined/all_results_combined.txt ./$name
                curl -s -X POST "https://api.telegram.org/bot${{ secrets.TOKENTELEGRAM }}/sendDocument" \
                     -F chat_id="${{ secrets.CHATIDTELEGRAM }}" \
                     -F document="@./$name"
    SendAllDomains:
        runs-on: ubuntu-latest
        needs: FilterSubdomains
        steps:
            - name: Download artifacts
              uses: actions/download-artifact@v4
              with:
                path: ./domains

            - name: Send Telegram Notification
              run: |
                name="report-${{ env.DOMAIN }}-$(date '+%Y-%m-%d_%H-%M-%S')-allDomains.txt"
                cp ./domains/subdomains_alive/all_results_sorted.txt ./$name
                curl -s -X POST "https://api.telegram.org/bot${{ secrets.TOKENTELEGRAM }}/sendDocument" \
                     -F chat_id="${{ secrets.CHATIDTELEGRAM }}" \
                     -F document="@./$name"
    
    SendSubdomainTakeover:
        runs-on: ubuntu-latest
        needs: FilterSubdomains
        steps:
            - name: Download artifacts
              uses: actions/download-artifact@v4
              with:
                path: ./takeover
            
            - name: Run subdomain takeover check
              run: |
                  INPUT_FILE="./takeover/subdomains_alive/all_results_sorted.txt"
                  OUTPUT_FILE="./subdomain_takeover_results.txt"
                  > "$OUTPUT_FILE"
                  while read -r subdomain; do
                    echo "Checking: $subdomain" >> $OUTPUT_FILE
                    resolver=$(dig CNAME "$subdomain" +short)
                    filter=$(echo "$resolver" | grep -iE 's3|github\.io|githubusercontent|heroku|azurewebsites|cloudfront|netlify|ghost\.io|wordpress|surge\.sh|shopify|statuspage|storage\.googleapis|firebaseapp|vercel|render|fly\.io|railway|pythonanywhere|000webhost|weebly|tumblr|blogspot|fastly|akamaiedge|edgekey|digitaloceanspaces|nyc3\.digitaloceanspaces|sfo3\.digitaloceanspaces|ams3\.digitaloceanspaces|fra1\.digitaloceanspaces|blob\.core\.windows\.net|file\.core\.windows\.net|queue\.core\.windows\.net|table\.core\.windows\.net|azureedge\.net|azurewebsites\.net|cloudapp\.net|trafficmanager\.net|appservice|azure-api\.net|azure-mobile\.net|azure-sql\.net|mysql\.database\.azure\.com|postgres\.database\.azure\.com|redis\.cache\.windows\.net|mongodb\.cosmos\.azure\.com|cassandra\.cosmos\.azure\.com|gremlin\.cosmos\.azure\.com|table\.cosmos\.azure\.com|s3\.amazonaws\.com|s3-website|s3-\w+\.amazonaws\.com|s3\.dualstack|r2\.cloudflarestorage\.com|backblazeb2|b2\.cloud|wasabisys|dreamhost|linodeobjects|servercentral|jp\-osaka|sgp\-1|syd\-1|fra\-1|ams\-1|blr\-1|sfo\-3|nyc\-3|tor\-1|lon\-1|syd\-1|sin\-1')
                    if [[ -n "$filter" ]]; then
                          echo "$subdomain -> $resolver" >> "$OUTPUT_FILE"
                          ip=$(dig +short "$resolver")
                          if [[ -n "$ip" ]]; then
                              echo "IP address: $ip" >> "$OUTPUT_FILE"
                          else
                              echo "No IP address found" >> "$OUTPUT_FILE"
                          fi
                      fi
                  done < "$INPUT_FILE"

            - name: Send Telegram Notification
              run: |
                name="report-${{ env.DOMAIN }}-$(date '+%Y-%m-%d_%H-%M-%S')-SubdomainTakeover.txt"
                cp ./subdomain_takeover_results.txt ./$name
                curl -s -X POST "https://api.telegram.org/bot${{ secrets.TOKENTELEGRAM }}/sendDocument" \
                     -F chat_id="${{ secrets.CHATIDTELEGRAM }}" \
                     -F document="@./$name"